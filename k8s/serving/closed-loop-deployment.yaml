---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: closed-loop-sa
  namespace: open5gs
  annotations:
    # IRSA: allows this SA to call sagemaker:InvokeEndpoint via web identity
    eks.amazonaws.com/role-arn: "arn:aws:iam::749534910877:role/5g-core-closed-loop-sa-role"

---
# RBAC: closed-loop engine may only scale the UPF deployment (resourceNames scoped)
# Tightened by security hardening — Phase 8 (k8s/security/rbac.yaml)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: closed-loop-role
  namespace: open5gs
  annotations:
    security.open5gs/last-reviewed: "2026-05-27"
    security.open5gs/reason: "Scoped to upf only — closed-loop engine must not patch other NF deployments"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
    resourceNames: ["upf"]   # scoped: cannot patch smf, amf, or any other NF
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update"]
    resourceNames: ["upf"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: closed-loop-rolebinding
  namespace: open5gs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: closed-loop-role
subjects:
  - kind: ServiceAccount
    name: closed-loop-sa
    namespace: open5gs

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: closed-loop-engine
  namespace: open5gs
  labels:
    app: closed-loop-engine
    phase: "8.6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: closed-loop-engine
  template:
    metadata:
      labels:
        app: closed-loop-engine
    spec:
      serviceAccountName: closed-loop-sa
      containers:
        - name: closed-loop
          image: 749534910877.dkr.ecr.us-east-1.amazonaws.com/5g-core/closed-loop:latest
          imagePullPolicy: Always
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"
            - name: ANOMALY_ENDPOINT
              value: "anomaly-detector-endpoint"
            - name: FORECAST_ENDPOINT
              value: "traffic-forecaster-endpoint"
            - name: CLASSIFIER_ENDPOINT
              value: "state-classifier-endpoint"
            - name: AWS_REGION
              value: "us-east-1"
            - name: POLL_INTERVAL_S
              value: "30"
            - name: NAMESPACE
              value: "open5gs"
            - name: DRY_RUN
              value: "false"
            - name: LOG_FILE
              value: "/logs/closed_loop.log"
          volumeMounts:
            - name: logs
              mountPath: /logs
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
      volumes:
        - name: logs
          emptyDir: {}
      restartPolicy: Always
