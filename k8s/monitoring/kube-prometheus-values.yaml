# =============================================================================
# kube-prometheus-stack Helm values for Open5GS Phase 8.5 (EKS + AMP)
# Prometheus scrapes AMF/SMF/UPF/PCF native /metrics (port 9090)
# kube-state-metrics covers all other NFs via pod/container metrics
# remote_write → AWS Managed Prometheus (AMP) via IRSA SigV4 auth
# =============================================================================

fullnameOverride: prometheus

# ── Grafana is deployed as standalone helm release (see monitoring.tf) ──────
grafana:
  enabled: false

# ── Prometheus ───────────────────────────────────────────────────────────────
prometheus:
  serviceAccount:
    name: prometheus
    annotations:
      # IRSA: allows Prometheus pod to assume AMP write role without access keys
      eks.amazonaws.com/role-arn: "arn:aws:iam::749534910877:role/5g-core-prometheus-amp-role"

  prometheusSpec:
    # Scrape interval — fine-grained for HPA triggering visibility
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Allow ServiceMonitors from any namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 7d
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: 500m
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

    # ── AMP remote_write via SigV4 (IRSA — no access keys needed) ───────────
    remoteWrite:
      - url: "https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-6f6aefa7-9c99-423a-afc3-65ef0832f154/api/v1/remote_write"
        sigv4:
          region: us-east-1
        queueConfig:
          maxSamplesPerSend: 1000
          maxShards: 200
          capacity: 2500

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
  # Email notification config — applied to the live cluster via kubectl secret patch
  # (helm upgrade fails on chart version mismatch against the installed 83.7.0 release).
  # To re-apply: kubectl patch secret alertmanager-prometheus-alertmanager -n monitoring \
  #   --type=json -p='[{"op":"replace","path":"/data/alertmanager.yaml","value":"<b64>"}]'
  # SMTP password: Gmail App Password (never commit — supply via CI secret or manually).
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: nigelkadzinga91@gmail.com
      smtp_auth_username: nigelkadzinga91@gmail.com
      smtp_auth_password: "${ALERTMANAGER_SMTP_PASSWORD}"
      smtp_require_tls: true
    inhibit_rules:
    - equal: [namespace, alertname]
      source_matchers: [severity = critical]
      target_matchers: [severity =~ warning|info]
    - equal: [namespace, alertname]
      source_matchers: [severity = warning]
      target_matchers: [severity = info]
    - equal: [namespace]
      source_matchers: [alertname = InfoInhibitor]
      target_matchers: [severity = info]
    - target_matchers: [alertname = InfoInhibitor]
    receivers:
    - name: "null"
    - name: email-notifications
      email_configs:
      - to: nigelkadzinga91@gmail.com
        send_resolved: true
    route:
      group_by: [namespace]
      group_interval: 5m
      group_wait: 30s
      receiver: email-notifications
      repeat_interval: 12h
      routes:
      - matchers: [alertname = "Watchdog"]
        receiver: "null"
    templates:
    - /etc/alertmanager/config/*.tmpl

# kube-state-metrics — exposes HPA, pod, container metrics
kube-state-metrics:
  enabled: true

# node-exporter — per-node CPU/memory
nodeExporter:
  enabled: true

# Disable EKS managed control-plane components (not scrapeable)
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
