# =============================================================================
# WebUI — Open5GS Subscriber Management UI (Tier 9)
#
# Connects to MongoDB via internal DNS (mongodb:27017).
# Exposed on NodePort 30999 for direct access; port-forward to 9999 for dev.
#
# Login: admin / 1423
#
# PATCH: The gradiant/open5gs-webui:2.7.2 image hardcodes serverSelectionTimeoutMS=1000
# in /opt/open5gs-webui/server/index.js. We mount a ConfigMap-patched version of that
# file (timeout raised to 30000ms) over the original, removing the crash-loop on cold boot.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: open5gs
  labels:
    app: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
    spec:
      containers:
        - name: webui
          image: gradiant/open5gs-webui:2.7.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9999
              name: http
          env:
            - name: DB_URI
              value: mongodb://mongodb/open5gs
            - name: PORT
              value: "9999"
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            # Override the hardcoded 1000ms serverSelectionTimeoutMS with 30000ms.
            # The ConfigMap was generated from the original file with a targeted sed patch.
            - name: server-patch
              mountPath: /opt/open5gs-webui/server/index.js
              subPath: index.js
      volumes:
        - name: server-patch
          configMap:
            name: webui-server-patch
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: open5gs
  labels:
    app: webui
spec:
  selector:
    app: webui
  type: NodePort
  ports:
    - name: http
      port: 9999
      targetPort: 9999
      nodePort: 30999
      protocol: TCP
