# =============================================================================
# MongoDB — StatefulSet so the pod gets a stable hostname (mongodb-0)
# and a dedicated PVC for subscriber data persistence.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: open5gs
  labels:
    app: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "256Mi"      # tuned: WiredTiger cache min + journal + index
              cpu: "200m"          # tuned: subscriber attach queries are bursty
            limits:
              memory: "512Mi"      # tuned: 512Mi → ~256Mi WiredTiger cache at 1024 UEs
              cpu: "500m"          # tuned: single-threaded queries peak under lab load
          # tcpSocket probe: mongosh startup takes >1s which exceeds the default
          # 1s probe timeout. A TCP check on port 27017 is sufficient — if the
          # socket is accepting connections MongoDB is ready to serve queries.
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30   # tuned: WiredTiger journal replay on crash-restart
            periodSeconds: 15         # tuned: detect MongoDB hang faster
            failureThreshold: 3
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: open5gs
  labels:
    app: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
  # ClusterIP (not headless) so UDR/PCF get a stable DNS entry immediately.
  # publishNotReadyAddresses lets NFs connect even while MongoDB is still initializing.
  publishNotReadyAddresses: true
