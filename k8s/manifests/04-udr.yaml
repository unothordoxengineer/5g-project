# =============================================================================
# UDR — Unified Data Repository (Tier 2)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: udr-config
  namespace: open5gs
data:
  udr.yaml: |
    logger:
      level: info

    db_uri: mongodb://mongodb/open5gs

    global:
      max:
        ue: 1024

    udr:
      sbi:
        server:
          - address: 0.0.0.0
            port: 80
            advertise: udr
        client:
          nrf:
            - uri: http://nrf

    time:
      nf_instance:
        validity: 86400
        heartbeat: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udr
  namespace: open5gs
  labels:
    app: udr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udr
  template:
    metadata:
      labels:
        app: udr
    spec:
      containers:
        - name: udr
          image: open5gs-udr:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["NET_BIND_SERVICE"]
          args:
            - /usr/local/bin/open5gs-udrd
            - -c
            - /etc/open5gs/udr.yaml
          env:
            - name: DB_URI
              value: "mongodb://mongodb/open5gs"
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"      # tuned: signalling-only NFs; peak <100Mi under load
              cpu: "200m"          # tuned: SBI message processing is lightweight
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30   # tuned: NF startup + NRF registration window
            periodSeconds: 15         # tuned: faster deadlock detection
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs/udr.yaml
              subPath: udr.yaml
      volumes:
        - name: config
          configMap:
            name: udr-config
---
apiVersion: v1
kind: Service
metadata:
  name: udr
  namespace: open5gs
  labels:
    app: udr
spec:
  selector:
    app: udr
  ports:
    - name: sbi
      port: 80
      targetPort: 80
